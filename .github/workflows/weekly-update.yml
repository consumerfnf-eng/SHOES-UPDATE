name: Weekly Curated Shoes Update
on:
  schedule:
    - cron: '0 23 * * 6' # Sunday 08:00 Asia/Seoul
    - cron: '0 11 * * 0' # Sunday 20:00 KST retry if no completed collection this week
    - cron: '0 21 * * 0' # Monday 06:00 KST final catch-up
  workflow_dispatch:
    inputs:
      force:
        # Default true. Starting this by hand is a request to collect, and the
        # old default meant the opposite: the 2026-10-30 17:15 dispatch, asked
        # for precisely because sixteen maisons had just been added, exited in
        # 0.3 seconds on "this week already has a completed collection" and
        # reported success. The staleness guard now notices a changed brand
        # list on its own (scripts/collection-scope.mjs), so leaving this on
        # only costs a re-collection nobody has to argue with.
        description: 'Run a fresh collection even when this week already completed'
        required: false
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: shoes-publication
  cancel-in-progress: false
env:
  # Some official stores answer with more than Node's default 16KB of
  # headers; HOKA failed every request with UND_ERR_HEADERS_OVERFLOW,
  # which reads like a block and is a client limit.
  NODE_OPTIONS: --max-http-header-size=65536

jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main # Read the latest publication after waiting for concurrency.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Only the image reader, not the whole collection stack: this job runs
      # one Python step and it reads already-cached files off the disk.
      - run: python -m pip install 'Pillow>=10,<14'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Decide which maisons' shops hold only this season
        # Before collecting, not during: the determination changes which
        # shelves the collection reads, and a shop with no New section has to
        # be understood before it can be read. Never fails the run - a maison
        # with no determination is collected exactly as it was.
        continue-on-error: true
        env:
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          SCRAPINGBEE_API_KEY: ${{ secrets.SCRAPINGBEE_API_KEY }}
          SCRAPINGBEE_SHELF_CREDITS: ${{ vars.SCRAPINGBEE_SHELF_CREDITS || '400' }}
        run: node scripts/classify-luxury-shelf.mjs
      - name: Collect and verify complete weekly snapshot
        env:
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          SCRAPINGBEE_API_KEY: ${{ secrets.SCRAPINGBEE_API_KEY }}
          # Overridable without editing the collection. The defaults in
          # scripts/weekly-update.mjs are what a luxury-first pass needs; a
          # tighter account can lower them in repository variables.
          SCRAPINGBEE_OFFICIAL_CREDITS: ${{ vars.SCRAPINGBEE_OFFICIAL_CREDITS || '800' }}
          OFFICIAL_NEW_BUDGET_MINUTES: ${{ vars.OFFICIAL_NEW_BUDGET_MINUTES || '150' }}
        run: |
          if [ "${{ github.event_name }}" = 'workflow_dispatch' ] && [ "${{ inputs.force }}" = 'true' ]; then
            npm run weekly
          else
            npm run weekly -- --only-if-stale
          fi
      - name: Read each retailer's own ranking board
        # Not part of the catalogue: two boards read straight from the shops,
        # compared with the previous week's reading. A board that cannot be
        # read keeps the last one that could, so this never fails the run.
        continue-on-error: true
        run: npm run ranks
      - name: Cache verified official photos before publication
        run: npm run photos
      - name: Read each product's colour off its own cached photo
        run: npm run colors
      - name: Validate snapshot before archive writes
        run: npm run build
      - name: Append eligible expired products to existing archive sheets
        id: archive
        continue-on-error: true
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          ARCHIVE_BACKUP_KEY: ${{ secrets.ARCHIVE_BACKUP_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/archive-expired.mjs --apply
      - name: Publish validated snapshot via existing Cloudflare Git integration
        run: |
          git config user.name 'Shoes Dashboard Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/publication-history.json data/catalog-source.json data/curation-review.json data/archive-queue.json data/photo-cache.json data/rank-boards.json data/pending-candidates.json data/luxury-shelf-basis.json public/data/catalog.json public/data/rank-boards.json public/images
          if ! git diff --cached --quiet; then
            git commit -m "weekly curated shoes update $(date -u +%F)"
            # main moves while this runs (the daily workflow, or a person
            # pushing) - an hour of collection must not be thrown away to a
            # non-fast-forward rejection, so rebase onto whatever landed and
            # retry.
            #
            # Every path this step commits is generated, and a line-by-line
            # merge of two JSON snapshots means nothing: run 41011572077
            # collected for an hour and twenty minutes and then threw all of
            # it away because three commits had landed on main in the
            # meantime and git was asked, three times, to merge two versions
            # of catalog.json.
            #
            # So a conflict is not merged. The collection is re-applied: the
            # tree is reset to whatever main now holds, and every record this
            # run verified - which `onProgress` has been writing to
            # logs/weekly-progress.json all along - is merged back in by
            # product id and republished on top of the code that just landed.
            # That is the same operation the collection itself performs, so
            # the result does not depend on which commit won a text merge, and
            # re-running it is harmless. A conflict outside the generated
            # snapshot is a real one and still stops the run.
            generated='data/publication-history.json data/catalog-source.json data/curation-review.json data/archive-queue.json data/photo-cache.json data/rank-boards.json data/pending-candidates.json data/luxury-shelf-basis.json public/data/catalog.json public/data/rank-boards.json'
            cp logs/weekly-progress.json "$RUNNER_TEMP/weekly-progress.json"
            published=0
            for attempt in 1 2 3; do
              git fetch origin main
              if ! git rebase origin/main; then
                conflicts=$(git diff --name-only --diff-filter=U)
                unexpected=''
                for f in $conflicts; do
                  case " $generated " in
                    *" $f "*) ;;
                    *) case "$f" in public/images/*) ;; *) unexpected="$unexpected $f";; esac;;
                  esac
                done
                git rebase --abort
                if [ -n "$unexpected" ]; then
                  echo "::error::Conflict outside the generated snapshot:$unexpected"
                  exit 1
                fi
                echo "Re-applying the collection onto origin/main instead of merging generated JSON."
                git reset --hard origin/main
                node scripts/recover-collection.mjs "$RUNNER_TEMP/weekly-progress.json"
                npm run photos
                npm run build
                git add $generated public/images
                git commit -m "weekly curated shoes update $(date -u +%F)" || true
              fi
              if git push origin HEAD:main; then published=1; break; fi
              sleep 10
            done
            if [ "$published" != 1 ]; then
              echo '::error::Collected snapshot could not be published after 3 rebase/push attempts.'
              exit 1
            fi
          fi
      - name: Save collection diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-diagnostics-${{ github.run_id }}
          path: |
            logs/weekly-progress.json
            logs/weekly-diagnostics.json
            logs/weekly-error.json
            data/archive-report.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Report archive connection or verification failure
        if: always() && steps.archive.outcome == 'failure'
        run: |
          echo 'Archive append was blocked or failed. Encrypted audit and pending receipts are stored on archive-audit before any Sheet write. Review the archive connection and retry queue.' >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - name: Flag archive items requiring review
        if: always() && steps.archive.outputs.archive_attention == 'true'
        run: echo '::warning::Archive items require brand classification or reconciliation. See the archive summary; pending items were retained.'
