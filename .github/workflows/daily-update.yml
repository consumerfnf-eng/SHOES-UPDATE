name: Daily Expiry and Archive Maintenance
on:
  schedule:
    - cron: '15 22 * * *' # 07:15 KST; no source crawling
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: shoes-publication
  cancel-in-progress: false
jobs:
  maintenance:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Expire products by calendar date without crawling
        run: npm run daily
      - name: Validate snapshot before archive writes
        run: npm run build
      - name: Append only verified expired records
        id: archive
        continue-on-error: true
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          ARCHIVE_BACKUP_KEY: ${{ secrets.ARCHIVE_BACKUP_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/archive-expired.mjs --apply
      - name: Publish expiry snapshot
        run: |
          git config user.name 'Shoes Dashboard Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add public/data/catalog.json data/archive-queue.json data/curation-review.json data/publication-history.json
          if ! git diff --cached --quiet; then
            git commit -m "shoes expiry maintenance $(date -u +%F)"
            git push origin HEAD:main
          fi
      - name: Report archive connection or verification failure
        if: always() && steps.archive.outcome == 'failure'
        run: |
          echo 'Archive append requires attention. Queue remains intact; encrypted pending/verified receipts are recoverable from archive-audit.' >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - name: Flag archive items requiring review
        if: always() && steps.archive.outputs.archive_attention == 'true'
        run: echo '::warning::Archive items require brand classification or reconciliation. Pending items were retained; see the archive summary.'
