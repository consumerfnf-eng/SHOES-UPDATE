name: Weekly Retail and Newsletter Shoes Update
on:
  schedule:
    # Staggered after Weekly Curated Shoes Update (Sunday 08:00 KST) - same
    # shoes-publication concurrency group, so this would queue behind it
    # even without the offset, but running it a day later keeps retail/SNS
    # matching against that week's freshly-published official catalog.
    # Sunday morning, the same window as the official New Arrivals run. The
    # two share the `shoes-publication` concurrency group, so they queue
    # rather than collide; this one starts an hour later so the official
    # collection has the publication lock first.
    - cron: '0 0 * * 0'   # Sunday 09:00 Asia/Seoul
    - cron: '0 11 * * 0'  # Sunday 20:00 KST retry if no completed run this week
    - cron: '0 21 * * 0'  # Monday 06:00 KST final catch-up
  workflow_dispatch:
    inputs:
      force:
        description: 'Run a fresh collection even when this week already completed'
        required: false
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: shoes-publication
  cancel-in-progress: false
env:
  # Some official stores answer with more than Node's default 16KB of
  # headers; HOKA failed every request with UND_ERR_HEADERS_OVERFLOW,
  # which reads like a block and is a client limit.
  NODE_OPTIONS: --max-http-header-size=65536

jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-trends.txt
      - name: Collect retail/newsletter weekly snapshot
        # IG_SESSION_B64 (if the user has registered one) is restored to a
        # temp file in-process by collect_instagram.py and removed when it
        # finishes; nothing is ever written to disk by this workflow itself.
        env:
          IG_USERNAME: ${{ secrets.IG_USERNAME }}
          IG_SESSION_B64: ${{ secrets.IG_SESSION_B64 }}
          SCRAPINGBEE_API_KEY: ${{ secrets.SCRAPINGBEE_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = 'workflow_dispatch' ] && [ "${{ inputs.force }}" = 'true' ]; then
            npm run monthly
          else
            npm run monthly -- --only-if-stale
          fi
      # The colour vocabulary that decides which listings are one model comes
      # from the colourways the retailers themselves wrote. Rebuilt after the
      # run that collected them, so a shade first seen this week groups from
      # next week - the alternative is grouping against a vocabulary that
      # only ever grows stale.
      - name: Rebuild the colour vocabulary from what was collected
        run: python scripts/monthly/build_colour_words.py
      - name: Run offline retail/newsletter tests before publishing
        run: python -m unittest discover -s tests -p 'test_monthly_*.py' -v
      # Written after both Sunday collections have published, so the figures
      # are the week's final ones rather than a half-finished run's.
      - name: Write the weekly briefing
        if: always()
        run: npm run briefing
      - name: Email the weekly briefing
        id: briefing
        if: always()
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER || 'smtp.gmail.com' }}
          server_port: ${{ secrets.MAIL_PORT || 465 }}
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: SHOES Research
          to: rlapwls39@fnfcorp.com
          subject: "[SHOES] 주간 브리핑 · ${{ github.event.repository.updated_at }}"
          html_body: file://logs/weekly-briefing.html
          body: file://logs/weekly-briefing.txt
          attachments: logs/weekly-briefing.json
      - name: Say so when the briefing could not be sent
        if: always() && steps.briefing.outcome != 'success'
        run: |
          echo '주간 브리핑을 만들었지만 메일로 보내지 못했습니다. MAIL_USERNAME / MAIL_PASSWORD 시크릿이 필요합니다.' >> "$GITHUB_STEP_SUMMARY"
          echo '브리핑 본문은 이 실행의 아티팩트(weekly-briefing)에 들어 있습니다.' >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the briefing as an artifact either way
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-briefing-${{ github.run_id }}
          path: |
            logs/weekly-briefing.html
            logs/weekly-briefing.txt
            logs/weekly-briefing.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Publish weekly snapshot via existing Cloudflare Git integration
        run: |
          git config user.name 'Shoes Dashboard Bot'
          git config user.email 'actions@users.noreply.github.com'
          # image-signals.json is the photo-analysis cache and
          # model-first-listed.json is the re-release index: both only work
          # if they survive between runs, so they are committed too.
          git add config/colour-words.json data/collection-history.json data/monthly-catalog-source.json data/monthly-run-report.json data/monthly-unmatched-mentions.json data/trend-history.csv data/image-signals.json data/model-first-listed.json config/trend-seed-hashtags.json public/data/monthly-catalog.json public/data/trend-keywords.json
          if ! git diff --cached --quiet; then
            git commit -m "weekly retail/newsletter shoes update $(date -u +%F)"
            # See weekly-update.yml: main can move during a long collection,
            # so rebase onto it and retry rather than losing the run's work.
            published=0
            for attempt in 1 2 3; do
              git fetch origin main
              if git rebase origin/main; then
                if git push origin HEAD:main; then published=1; break; fi
              else
                git rebase --abort
              fi
              sleep 10
            done
            if [ "$published" != 1 ]; then
              echo '::error::Collected snapshot could not be published after 3 rebase/push attempts.'
              exit 1
            fi
          fi
      - name: Save collection diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monthly-diagnostics-${{ github.run_id }}
          path: |
            data/monthly-staging-ssense.json
            data/monthly-staging-musinsa.json
            data/monthly-staging-29cm.json
            data/monthly-staging-wconcept.json
            data/monthly-staging-lyst.json
            data/monthly-staging-farfetch-mytheresa.json
            data/monthly-staging-newsletter.json
            data/monthly-staging-instagram.json
            data/monthly-staging-ig-hashtags.json
            data/monthly-run-report.json
            data/trend-history.csv
          if-no-files-found: ignore
          retention-days: 14
