name: Weekly Retail and Newsletter Shoes Update
on:
  schedule:
    # Staggered after Weekly Curated Shoes Update (Sunday 08:00 KST) - same
    # shoes-publication concurrency group, so this would queue behind it
    # even without the offset, but running it a day later keeps retail/SNS
    # matching against that week's freshly-published official catalog.
    - cron: '0 23 * * 0'  # Monday 08:00 Asia/Seoul
    - cron: '0 11 * * 1'  # Monday 20:00 KST retry if no completed run this week
  workflow_dispatch:
    inputs:
      force:
        description: 'Run a fresh collection even when this week already completed'
        required: false
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: shoes-publication
  cancel-in-progress: false
jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-trends.txt
      - name: Collect retail/newsletter weekly snapshot
        # IG_SESSION_B64 (if the user has registered one) is restored to a
        # temp file in-process by collect_instagram.py and removed when it
        # finishes; nothing is ever written to disk by this workflow itself.
        env:
          IG_USERNAME: ${{ secrets.IG_USERNAME }}
          IG_SESSION_B64: ${{ secrets.IG_SESSION_B64 }}
          SCRAPINGBEE_API_KEY: ${{ secrets.SCRAPINGBEE_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = 'workflow_dispatch' ] && [ "${{ inputs.force }}" = 'true' ]; then
            npm run monthly
          else
            npm run monthly -- --only-if-stale
          fi
      - name: Run offline retail/newsletter tests before publishing
        run: python -m unittest discover -s tests -p 'test_monthly_*.py' -v
      - name: Publish weekly snapshot via existing Cloudflare Git integration
        run: |
          git config user.name 'Shoes Dashboard Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/monthly-catalog-source.json data/monthly-run-report.json data/monthly-unmatched-mentions.json public/data/monthly-catalog.json
          if ! git diff --cached --quiet; then
            git commit -m "weekly retail/newsletter shoes update $(date -u +%F)"
            # See weekly-update.yml: main can move during a long collection,
            # so rebase onto it and retry rather than losing the run's work.
            published=0
            for attempt in 1 2 3; do
              git fetch origin main
              if git rebase origin/main; then
                if git push origin HEAD:main; then published=1; break; fi
              else
                git rebase --abort
              fi
              sleep 10
            done
            if [ "$published" != 1 ]; then
              echo '::error::Collected snapshot could not be published after 3 rebase/push attempts.'
              exit 1
            fi
          fi
      - name: Save collection diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monthly-diagnostics-${{ github.run_id }}
          path: |
            data/monthly-staging-ssense.json
            data/monthly-staging-musinsa.json
            data/monthly-staging-29cm.json
            data/monthly-staging-wconcept.json
            data/monthly-staging-lyst.json
            data/monthly-staging-farfetch-mytheresa.json
            data/monthly-staging-newsletter.json
            data/monthly-staging-instagram.json
            data/monthly-staging-ig-hashtags.json
            data/monthly-run-report.json
          if-no-files-found: ignore
          retention-days: 14
